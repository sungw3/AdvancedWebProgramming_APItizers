{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Account</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'css/sign-create-style.css' %}">
    <link rel="stylesheet" href="{% static 'css/nav-bar.css' %}">
</head>
<body class="bg-light min-vh-100 d-flex align-items-center justify-content-center">
    <div class="card shadow-sm register-card">
        <div class="card-body">
            <h3 class="card-title text-center mb-4">Create New Account</h3>
            <form id="signupForm" class="needs-validation" novalidate>
                {% csrf_token %}
                
                <div class="mb-3">
                    <label for="newNick" class="form-label fw-bold">Nickname</label>
                    <input type="text" class="form-control" id="newNick" required>
                    <div class="input-hint">Nick name shows to your friends</div>
                    <div class="invalid-feedback">Please choose a Nickname.</div>
                </div>

                <div class="mb-3">
                    <label for="newId" class="form-label fw-bold">Username (ID)</label>
                    <input type="text" class="form-control" id="newId" required>
                    <div class="invalid-feedback">Please enter a Username.</div>
                </div>

                <div class="mb-3">
                    <label for="newPassword" class="form-label fw-bold">Password</label>
                    <input type="password" class="form-control" id="newPassword" required>
                    <div class="invalid-feedback">Please enter a Password.</div>
                </div>

                <div class="mb-3">
                    <label for="confirmPassword" class="form-label fw-bold">Confirm Password</label>
                    <input type="password" class="form-control" id="confirmPassword" required>
                    <div class="invalid-feedback">Please confirm your Password.</div>
                </div>

                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-success btn-lg">Sign Up</button>
                </div>
            </form>

            <div class="text-center mt-5">
                <a href="{% url 'login' %}" class="small">Log In</a>
            </div>
            <div class="text-center mt-4">
                <a href="{% url 'home' %}" class="small">Home</a>
            </div>
        </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1055;">
        <div id="appToast" class="toast align-items-center text-bg-primary border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body" id="toastMessage"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/api.js' %}"></script>
    <script src="{% static 'js/nav-bar.js' %}"></script>
    <script src="{% static 'js/signup.js' %}"></script>
</body>
</html>
