<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Getting Started - Chatting with Emotion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/nav-bar.css">
    <link rel="stylesheet" href="css/about.css">
</head>

<body>

    <div id="nav-placeholder"></div>
    <script src="js/nav-bar.js"></script>

    <div class="container mb-5 guide-box">
        <br>

        <div id="projectCarousel" class="carousel slide carousel-fade shadow-lg rounded-4 overflow-hidden"
            data-bs-ride="carousel">

            <div class="carousel-indicators">
                <button type="button" data-bs-target="#projectCarousel" data-bs-slide-to="0" class="active"
                    aria-current="true" aria-label="Slide 1"></button>
                <button type="button" data-bs-target="#projectCarousel" data-bs-slide-to="1"
                    aria-label="Slide 2"></button>
                <button type="button" data-bs-target="#projectCarousel" data-bs-slide-to="2"
                    aria-label="Slide 3"></button>
            </div>

            <div class="carousel-inner">

                <div class="carousel-item active">
                    <div class="d-flex flex-column">
                        <div class="carousel-img-wrapper" style="background-color: #2a2a2a;">
                            <img src="css/images/ex-about-1.png" class="d-block w-100 responsive-carousel-img"
                                alt="Main Interface">
                        </div>
                        <div class="custom-carousel-caption text-center">
                            <h3 class="fw-bold m-0" style="color: #F5EBE0;">Welcome to Chatting with Emotion</h3>
                            <p style="color: #ebdccb; margin: 8px 0 0 0;">Explore the future of emotional communication.
                            </p>
                        </div>
                    </div>
                </div>

                <div class="carousel-item">
                    <div class="d-flex flex-column">
                        <div class="carousel-img-wrapper" style="background-color: #2a2a2a;">
                            <img src="css/images/ex-about-2.png" class="d-block w-100 responsive-carousel-img"
                                alt="Emotion Bubbles">
                        </div>
                        <div class="custom-carousel-caption text-center">
                            <h3 class="fw-bold m-0" style="color: #000000;">Custom-built Markov Chain logic</h3>
                            <p style="color: #000000; margin: 8px 0 0 0;">Proprietary algorithm is used for predicting
                                personal mood patterns.</p>
                        </div>
                    </div>
                </div>

                <div class="carousel-item">
                    <div class="d-flex flex-column">
                        <div class="carousel-img-wrapper" style="background-color: #2a2a2a;">
                            <img src="css/images/ex-about-3.png" class="d-block w-100 responsive-carousel-img"
                                alt="Theme and Settings">
                        </div>
                        <div class="custom-carousel-caption text-center">
                            <a href="https://github.com/sungw3/AdvancedWebProgramming_APItizers"
                                class="btn btn-light fw-bold mb-2"
                                style="border-radius: 20px; font-size: 0.9rem; padding: 6px 16px;">Visit GitHub
                                Repository</a>
                            <p style="color: #ebdccb; margin: 5px 0 0 0; font-size: 0.85rem;">Devs: chj0919, GoldbangE,
                                sungw3</p>
                        </div>
                    </div>
                </div>

            </div>

            <button class="carousel-control-prev" type="button" data-bs-target="#projectCarousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#projectCarousel" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
