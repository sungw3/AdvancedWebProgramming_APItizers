<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Rooms - Chatting with Emotion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/nav-bar.css">
    <link rel="stylesheet" href="css/search-room.css">

</head>

<body>

    <div id="nav-placeholder"></div>
    <script src="js/nav-bar.js"></script>

    <div class="container mb-5">
        <div class="row mb-5 justify-content-center">
            <div class="col-md-8">
                <div class="input-group shadow-sm">
                    <input type="text" id="searchInput" class="form-control" placeholder="Search room by name">
                    <button class="btn btn-primary" type="button" onclick="searchRooms()">Search</button>
                    <button class="btn btn-warning fw-bold text-dark" type="button" onclick="forceEnterTestRoom()">
                        🛠️
                    </button>
                </div>
            </div>
        </div>

        <div id="room-list"></div>

        <div id="empty-state" class="text-center" style="display: none;">
            <div class="empty-icon" style="font-size: 3rem;">💬</div>
            <h4>Currently no rooms available.</h4>
            <p class="text-muted">Be the first to create the room!</p>
            <button class="btn btn-success mt-3" onclick="alert('moving to hosting room page')">create new room</button>
        </div>

        <div id="error-state" class="text-center mt-5" style="display: none;">
            <h4 class="text-danger">Failed to load room list.</h4>
            <p class="text-muted">Please check your server connection and try again.</p>
            <button class="btn btn-outline-danger mt-3" onclick="location.reload()">Retry Connection</button>
        </div>

        <nav aria-label="Page navigation" class="mt-5" id="pagination-nav">
            <ul class="pagination justify-content-center" id="pagination-list"></ul>
        </nav>
    </div>
    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1055;">
        <div id="appToast" class="toast align-items-center text-bg-primary border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body" id="toastMessage"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/search-room.js"></script>
    <script src="js/api.js"></script>

</body>

</html>
